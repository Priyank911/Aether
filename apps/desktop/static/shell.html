<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' https: data:">
  <title>Aether</title>
  <link rel="stylesheet" href="shell.css">
</head>
<body>
  <!-- Chrome-like shell (plan 3.1, section 10). The React renderer replaces this in Phase 4. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M15.5 4.5 8 12l7.5 7.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-fwd" viewBox="0 0 24 24"><path d="m8.5 4.5 7.5 7.5-7.5 7.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-reload" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M20 3v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
      <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18-3-3.5-3-14.5 0-18Z" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3.5 2.6 5.3 5.9.9-4.2 4.1 1 5.8-5.3-2.8-5.3 2.8 1-5.8L3.5 9.7l5.9-.9Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
      <symbol id="i-warning" viewBox="0 0 24 24"><path d="M12 4 2.8 20h18.4Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 10v4M12 17.2v.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 19V5L7.5 9.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m16 9 5 6m0-6-5 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    </defs>
  </svg>

  <div class="window">
    <div class="strip" role="tablist" aria-label="Tabs">
      <label class="space-chip" title="Switch Space">
        <span class="dot" id="space-dot" aria-hidden="true"></span>
        <select id="space" aria-label="Switch Space"></select>
        <svg class="chev" width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="m2 3.5 3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </label>
      <div class="tabs" id="tabs"></div>
      <button class="icon-btn strip-btn" id="new-tab" type="button" aria-label="New tab" title="New tab (Ctrl+T)"><svg width="16" height="16"><use href="#i-plus"/></svg></button>
    </div>
    <div class="toolbar">
      <button class="icon-btn" id="back" type="button" aria-label="Back" title="Back (Alt+Left)"><svg width="18" height="18"><use href="#i-back"/></svg></button>
      <button class="icon-btn" id="forward" type="button" aria-label="Forward" title="Forward (Alt+Right)"><svg width="18" height="18"><use href="#i-fwd"/></svg></button>
      <button class="icon-btn" id="reload" type="button" aria-label="Reload" title="Reload (Ctrl+R)"><svg width="18" height="18"><use href="#i-reload"/></svg></button>
      <form id="omnibox-form" class="omnibox" role="search">
        <span class="omni-icon" id="omni-icon"><svg width="14" height="14"><use href="#i-globe"/></svg></span>
        <input id="omnibox" type="text" spellcheck="false" autocomplete="off" aria-label="Address and search" placeholder="Search Google or type a web address">
      </form>
      <button class="icon-btn" id="panel" type="button" aria-label="Side panel" title="Side panel (Ctrl+\)"><svg width="17" height="17" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15 4v16" stroke="currentColor" stroke-width="1.8"/></svg></button>
      <span class="notice" id="notice" role="status" aria-live="polite"></span>
    </div>
    <div class="agentbar" id="agentbar" role="status" aria-live="polite" hidden>
      <span class="dot" id="agent-dot" aria-hidden="true"></span>
      <span class="aglabel" id="agent-label"></span>
      <span class="agmeta" id="agent-meta"></span>
      <span class="agactions" id="agent-actions"></span>
    </div>
  </div>
  <script src="shell.js"></script>
</body>
</html>
